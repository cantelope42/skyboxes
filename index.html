    <script>
      const Open = e => {
        var el = document.createElement('a')
        el.target = '_blank'
        el.href = e.getAttribute('data[file]')
        el.style.position = 'absolute'
        el.style.opacity = .00001
        document.body.appendChild(el)
        el.click()
        el.remove()
      }
